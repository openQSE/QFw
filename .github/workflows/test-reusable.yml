# Reusable Test Workflow
#
# This workflow contains the actual test logic for QFw. It is called by
# test-pr.yml, test-main.yml, and test-release.yml so that PR and main branch
# builds always run identical steps (no skew).
#
# Current CI scope:
#   - ci-syntax: Flake8 linting and Python syntax checks
#   - ci-mock: pytest tests under tests/mock
#   - ci-qdmi: released provider adapters
#   - ci-qiskit: IQM transpilation, targets and circuit formats on real Qiskit
#   - ci-pulser: the Pulser client against released Pulser
#   - ci-resolve: the requirements files resolve together with overrides
#
# Note: QFw integration tests require a running distributed framework
# (PRTE, DEFw, QPM services, simulator binaries) and cannot run on standard
# GitHub Actions runners. They are run manually or on dedicated hardware.
# When self-hosted runners or a containerized stack become available, add
# integration test steps here.
#
# To modify CI behavior for PRs vs main vs release, edit the caller workflows.

name: Reusable Test Workflow

on:
  workflow_call:
    inputs:
      upload_artifacts:
        description: 'Whether to upload test artifacts (true for main/release, false for PRs)'
        required: false
        type: boolean
        default: false
      python_versions:
        description: 'JSON array of Python versions to test'
        required: false
        type: string
        default: '["3.10", "3.12"]'

jobs:
  ci-qdmi:
    name: ci-qdmi (released providers)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install released QDMI adapters
      run: python -m pip install -r setup/qdmi-requirements.txt -c setup/requirements.txt pytest
    - name: Require provider adapters
      run: |
        python - <<'PY'
        from iqm.qdmi.qiskit import IQMBackend
        from amazon.braket.qdmi.qiskit import AmazonBraketBackend
        from ibm.qdmi.qiskit import IBMBackend
        PY
    - name: Test adapters and serialization without provider submission
      run: python -m pytest -q tests/qiskit/test_qdmi_adapters.py tests/qiskit/test_braket_qdmi.py tests/qiskit/test_ibm_qdmi.py

  ci-qiskit:
    name: ci-qiskit (pinned Qiskit)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install the pinned Qiskit and IQM packages
      # iqm-client ships iqm.qiskit_iqm, and declares qiskit<2.2 for its qiskit
      # extra. QFw installs it without the extra and pins a newer Qiskit, so
      # resolving the requirements does not show whether the two work
      # together. These tests are what does.
      run: python -m pip install -c setup/requirements.txt qiskit qiskit_aer qiskit-ibm-runtime iqm-client iqm-pulse iqm-station-control-client pyyaml psutil pytest
    - name: Test IQM transpilation, device targets and circuit formats
      run: python -m pytest -q tests/qiskit/test_iqm_transpile.py tests/qiskit/test_qfw_target.py tests/qiskit/test_circuit_format_client.py tests/qiskit/test_circuit_payload_qpy.py tests/qiskit/test_isa_circuits.py

  ci-resolve:
    name: ci-resolve (requirements resolve)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: astral-sh/setup-uv@v5
    - name: Resolve the files the build installs, with overrides
      # Mirrors the uv pip install command in README.md. Resolution only reads
      # package metadata, so nothing is installed.
      run: |
        uv pip compile \
          --override setup/overrides.txt \
          setup/build-requirements.txt setup/requirements.txt \
          -o "$RUNNER_TEMP/resolved.txt"

  ci-pulser:
    name: ci-pulser (released Pulser)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive  # DEFw's Python modules
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install Pulser and what the Pulser client imports
      run: python -m pip install -r setup/pulser-requirements.txt -c setup/requirements.txt qiskit pyyaml pytest
    - name: Test the Pulser client against real Pulser
      run: python -m pytest -q tests/pulser

  ci-syntax:
    name: ci-syntax (Python ${{ matrix.python-version }})
    strategy:
      matrix:
        python-version: ${{ fromJSON(inputs.python_versions) }}
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive  # DEFw submodule required for .flake8 config

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install flake8
      run: python -m pip install --upgrade pip flake8

    - name: Run ci-syntax
      # The ci-syntax helper lives in .github/scripts so CI support files stay
      # with the workflow definitions. Developers can run it locally as:
      #   ./.github/scripts/ci-syntax.sh
      run: bash .github/scripts/ci-syntax.sh

  ci-mock:
    name: ci-mock (Python ${{ matrix.python-version }})
    strategy:
      matrix:
        python-version: ${{ fromJSON(inputs.python_versions) }}
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive  # DEFw submodule required for .flake8 config

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install pytest
      # PyYAML is needed as well: the mock suite drives example scripts whose
      # preflight parses the site and device-access YAML, so without it
      # tests/mock/test_iqm_chem_driver_script.py fails on a missing module.
      #
      # The OpenTelemetry trio is needed by tests/test_qfw_telemetry.py. QFw
      # degrades to no-op instrumentation when they are absent, so they are a
      # soft dependency for running QFw, but the telemetry tests exercise the
      # real sampler and import them for it. Versions match
      # setup/requirements.txt.
      run: |
        python -m pip install --upgrade pip pytest pyyaml \
          'opentelemetry-api>=1.44.0' \
          'opentelemetry-sdk>=1.44.0' \
          'opentelemetry-exporter-otlp-proto-common>=1.44.0' \
          'opentelemetry-exporter-otlp-proto-http>=1.44.0'

    - name: Run ci-mock
      # The ci-mock helper mirrors the CI-safe mock pytest suite.
      # Developers can run it locally as:
      #   ./.github/scripts/ci-mock.sh
      run: bash .github/scripts/ci-mock.sh
